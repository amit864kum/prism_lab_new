name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/prism-ci
      JWT_SECRET: ci-only-secret-that-is-never-used-outside-github-actions
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic quality gates
        run: npm run verify

      - name: Verify storage migration dry run
        run: npm run migrate:storage:dry-run
